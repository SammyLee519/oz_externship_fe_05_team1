name: Sync Fork with Upstream except workflows

on:
  schedule:
    - cron: '0 */3 * * *' # 3시간마다 자동 실행
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

          token: ${{ secrets.PAT }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add upstream remote
        run: |
          # 학원 원본 레포 주소 (upstream) 등록
          git remote add upstream https://github.com/OZ-Coding-School/oz_externship_fe_05_team1.git || true

      - name: Fetch upstream
        run: git fetch upstream

      - name: Sync main with upstream/develop
        run: |
          # 1. 대상 브랜치인 main으로 이동
          git checkout main

          # 2. 현재 내 레포의 워크플로우 파일들을 임시 폴더로 대피 (배포 설정 보호)
          mkdir -p /tmp/workflows
          if [ -d ".github/workflows" ]; then
            cp -r .github/workflows/* /tmp/workflows/
          fi

          # 3. 학원 레포의 develop 브랜치 상태로 내 main을 강제로 덮어씀 (최신 코드 반영)
          git reset --hard upstream/develop

          # 4. 대피시켰던 내 워크플로우 파일들을 다시 복구
          mkdir -p .github/workflows
          cp -r /tmp/workflows/* .github/workflows/

          # 5. 변경사항이 있다면 커밋하고 origin(개인레포) main으로 강제 푸시
          git add .github/workflows
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: Sync with upstream develop, keeping workflows"
          fi

          # 'origin'은 액션 환경에서의 내 레포지토리를 의미합니다.
          git push --force origin main
